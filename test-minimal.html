<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Test</title>
</head>
<body>
    <h1 id="title">Test - Loading...</h1>
    <button onclick="testClick()">Test Button</button>
    
    <script type="module">
        console.log('Module script started');
        
        // Test 1: Direct DOM manipulation
        document.getElementById('title').textContent = 'Test - Script Running';
        
        // Test 2: Window function
        window.testClick = function() {
            alert('Button clicked!');
        };
        
        // Test 3: Dynamic import
        (async () => {
            try {
                console.log('About to import kaspa-core.js');
                const kaspa = await import('./kaspa-core.js');
                console.log('Import successful:', kaspa);
            } catch (error) {
                console.error('Import failed:', error);
                alert('Import failed: ' + error.message);
            }
        })();
    </script>
</body>
</html>
